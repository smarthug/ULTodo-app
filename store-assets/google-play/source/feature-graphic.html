<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULTodo Google Play Feature Graphic</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background: #f3efe7;
        color: #1a1814;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .graphic {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 48px;
        align-items: center;
        width: 1024px;
        height: 500px;
        padding: 56px 72px;
      }

      .graphic::before {
        content: "";
        position: absolute;
        inset: 34px;
        border: 2px solid rgba(26, 24, 20, 0.08);
        border-radius: 32px;
      }

      .copy,
      .mark {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #4f6b3c;
        font-size: 24px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        max-width: 540px;
        font-size: 76px;
        line-height: 0.95;
        letter-spacing: 0;
      }

      .sub {
        margin: 24px 0 0;
        max-width: 520px;
        color: #5f574c;
        font-size: 28px;
        line-height: 1.22;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 280px;
        height: 280px;
        border-radius: 56px;
        background: rgba(255, 255, 255, 0.52);
        box-shadow: 0 18px 60px rgba(26, 24, 20, 0.12);
      }

      .mark img {
        width: 232px;
        height: 232px;
      }
    </style>
  </head>
  <body>
    <section class="graphic" aria-label="ULTodo feature graphic">
      <div class="copy">
        <p class="eyebrow">ULTodo</p>
        <h1>Choose less. Finish more.</h1>
        <p class="sub">Brain dump, priority matrix, today's focus, and Pomodoro in one calm local app.</p>
      </div>
      <div class="mark">
        <img src="../../../assets/logo.svg" alt="" />
      </div>
    </section>
  </body>
</html>
