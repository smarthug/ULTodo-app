<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULTodo Support</title>
    <style>
      body {
        margin: 0;
        background: #f3efe7;
        color: #1a1814;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }

      h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin-bottom: 8px;
      }

      p,
      li {
        color: #4d463c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ULTodo Support</h1>
      <p>
        ULTodo is a local-first todo and focus app. For support, use the developer contact email shown on ULTodo's Google Play listing.
      </p>
      <p>
        When reporting a problem, include your device model, Android version, and a short description of what happened.
      </p>
    </main>
  </body>
</html>
